<section class="hero">
  <h1>{{ t().home.titleStart }} <span class="highlight">{{ t().home.titleHighlight }}</span></h1>
  <p class="subtitle">{{ t().home.subtitle }}</p>
  <div class="actions">
    <!-- Sem sessão, o authGuard leva ao login e depois volta aos serviços -->
    <a matButton="filled" class="cta" routerLink="/services">{{ t().home.bookCta }}</a>
    <a matButton="outlined" routerLink="/register" [queryParams]="{ type: 'professional' }">
      {{ t().home.professionalCta }}
    </a>
  </div>
</section>

<section class="features" [attr.aria-label]="t().home.featuresLabel">
  @for (feature of t().home.features; track feature.icon) {
    <mat-card appearance="outlined" class="feature">
      <mat-card-content>
        <span class="material-symbols-outlined feature-icon" aria-hidden="true">{{ feature.icon }}</span>
        <h2>{{ feature.title }}</h2>
        <p>{{ feature.description }}</p>
      </mat-card-content>
    </mat-card>
  }
</section>
